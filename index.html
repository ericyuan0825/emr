<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediPass | Personal Health Passport</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #1976d2;
            --primary-dark: #0d47a1;
            --primary-light: #64b5f6;
            --secondary: #4fc3f7;
            --background: #f4faff;
            --light-blue: #e3f2fd;
            --very-light-blue: #f8fcff;
            --border: #d6e9f7;
            --text: #1e293b;
            --gray: #64748b;
            --danger: #e53935;
            --success: #16a085;
            --white: #ffffff;
        }

        body {
            font-family:
                "Microsoft JhengHei",
                "Noto Sans TC",
                "Noto Sans JP",
                "Noto Sans KR",
                Arial,
                sans-serif;

            background:
                radial-gradient(circle at top left, #d9f1ff 0%, transparent 30%),
                linear-gradient(135deg, #f8fcff, #eaf6ff);

            color: var(--text);
            min-height: 100vh;
        }

        /* Header */

        header {
            background:
                linear-gradient(
                    135deg,
                    var(--primary-dark),
                    var(--primary),
                    var(--secondary)
                );

            color: white;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(25, 118, 210, 0.18);
        }

        .header-container {
            max-width: 1200px;
            margin: auto;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 55px;
            height: 55px;

            border-radius: 16px;

            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.3);

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 27px;
        }

        .brand h1 {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .brand p {
            font-size: 13px;
            opacity: 0.9;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        select,
        button {
            font-family: inherit;
        }

        #languageSelect {
            border: none;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            color: var(--primary-dark);
            font-weight: bold;
        }

        .header-btn {
            border: none;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            background: white;
            color: var(--primary-dark);
        }

        /* Main */

        main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px 50px;
        }

        /* Status */

        .status-bar {
            background: rgba(255,255,255,0.85);
            border: 1px solid var(--border);
            border-radius: 16px;

            padding: 15px 20px;
            margin-bottom: 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;

            box-shadow: 0 8px 25px rgba(25,118,210,0.06);
        }

        .status-text {
            color: var(--gray);
            font-size: 14px;
        }

        .status-text strong {
            color: var(--primary);
        }

        .save-actions {
            display: flex;
            gap: 10px;
        }

        .save-btn,
        .clear-btn {
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .save-btn {
            background: var(--primary);
            color: white;
        }

        .save-btn:hover {
            background: var(--primary-dark);
        }

        .clear-btn {
            background: #fff1f1;
            color: var(--danger);
        }

        /* Profile */

        .profile-card {
            background: rgba(255,255,255,0.92);
            border: 1px solid var(--border);
            border-radius: 24px;

            padding: 28px;
            margin-bottom: 20px;

            display: flex;
            align-items: center;
            gap: 25px;

            box-shadow: 0 12px 35px rgba(25,118,210,0.08);
        }

        .avatar {
            width: 110px;
            height: 110px;
            min-width: 110px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--secondary)
                );

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 45px;

            box-shadow: 0 10px 25px rgba(25,118,210,0.2);
        }

        .profile-info {
            flex: 1;
        }

        .profile-name {
            border: none;
            outline: none;

            font-size: 28px;
            font-weight: bold;

            width: 100%;
            color: var(--text);

            background: transparent;
            margin-bottom: 8px;
        }

        .profile-subtitle {
            color: var(--gray);
            margin-bottom: 18px;
        }

        .profile-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tag {
            background: var(--light-blue);
            color: var(--primary-dark);

            padding: 8px 12px;
            border-radius: 999px;

            font-size: 13px;
            font-weight: bold;
        }

        /* Emergency */

        .emergency {
            background:
                linear-gradient(
                    135deg,
                    #fff8f8,
                    #ffffff
                );

            border-left: 5px solid var(--danger);
            border-radius: 20px;

            padding: 24px;
            margin-bottom: 20px;

            box-shadow: 0 10px 30px rgba(229,57,53,0.06);
        }

        .emergency-title {
            color: var(--danger);
            font-size: 20px;
            margin-bottom: 18px;
        }

        /* Grid */

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgba(255,255,255,0.94);
            border: 1px solid var(--border);
            border-radius: 20px;

            padding: 24px;

            box-shadow: 0 10px 30px rgba(25,118,210,0.06);

            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 35px rgba(25,118,210,0.11);
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 10px;

            color: var(--primary-dark);

            padding-bottom: 15px;
            margin-bottom: 18px;

            border-bottom: 1px solid var(--border);
        }

        .icon-box {
            width: 42px;
            height: 42px;

            border-radius: 12px;
            background: var(--light-blue);

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 20px;
        }

        .card-title h2 {
            font-size: 18px;
        }

        /* Form */

        .form-group {
            margin-bottom: 15px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: var(--gray);
            margin-bottom: 7px;
        }

        input,
        textarea,
        select.form-select {
            width: 100%;

            border: 1px solid #cfe3f3;
            border-radius: 10px;

            padding: 11px 13px;

            font-size: 14px;
            color: var(--text);

            background: var(--very-light-blue);
            outline: none;

            transition: 0.2s;
        }

        input:focus,
        textarea:focus,
        select.form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(25,118,210,0.1);
            background: white;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            line-height: 1.6;
        }

        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* Footer */

        footer {
            text-align: center;
            padding: 30px 20px;
            color: var(--gray);
            font-size: 13px;
        }

        .last-update {
            margin-top: 8px;
            color: var(--primary);
        }

        /* Mobile */

        @media (max-width: 700px) {

            .header-container,
            .status-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .header-actions {
                justify-content: space-between;
            }

            .profile-card {
                flex-direction: column;
                text-align: center;
            }

            .profile-tags {
                justify-content: center;
            }

            .two-columns {
                grid-template-columns: 1fr;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .save-actions {
                width: 100%;
            }

            .save-actions button {
                flex: 1;
            }
        }

    </style>
</head>

<body>

<header>
    <div class="header-container">

        <div class="brand">
            <div class="logo">⚕️</div>

            <div>
                <h1 data-i18n="title">MediPass 個人健康護照</h1>
                <p data-i18n="subtitle">
                    Multilingual Personal Health Passport
                </p>
            </div>
        </div>

        <div class="header-actions">

            <select id="languageSelect" onchange="changeLanguage()">
                <option value="zh">繁體中文</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
                <option value="de">Deutsch</option>
            </select>

        </div>

    </div>
</header>


<main>

    <!-- 儲存列 -->

    <div class="status-bar">

        <div class="status-text">
            <strong data-i18n="editingMode">✏️ 填寫健康資料</strong>
            <br>
            <span data-i18n="storageInfo">
                資料會儲存在目前瀏覽器
            </span>
        </div>

        <div class="save-actions">
            <button class="save-btn" onclick="saveData()">
                💾 <span data-i18n="save">儲存資料</span>
            </button>

            <button class="clear-btn" onclick="clearData()">
                🗑️ <span data-i18n="clear">清除資料</span>
            </button>
        </div>

    </div>


    <!-- 個人資料 -->

    <section class="profile-card">

        <div class="avatar">👤</div>

        <div class="profile-info">

            <input
                type="text"
                id="fullName"
                class="profile-name"
                placeholder="請輸入你的姓名"
                data-placeholder="namePlaceholder"
            >

            <p class="profile-subtitle"
               data-i18n="profileDescription">
                請填寫你的重要個人健康資訊
            </p>

            <div class="profile-tags">
                <span class="tag">
                    🩸 <span data-i18n="bloodType">血型</span>
                    <span id="bloodPreview">--</span>
                </span>

                <span class="tag">
                    🌍 <span id="nationalityPreview">--</span>
                </span>
            </div>

        </div>

    </section>


    <!-- 緊急資訊 -->

    <section class="emergency">

        <h2 class="emergency-title">
            🚨 <span data-i18n="emergencyInfo">
                緊急醫療資訊
            </span>
        </h2>

        <div class="two-columns">

            <div class="form-group">
                <label data-i18n="emergencyContact">
                    緊急聯絡人
                </label>

                <input
                    type="text"
                    id="emergencyContact"
                    placeholder="姓名"
                >
            </div>

            <div class="form-group">
                <label data-i18n="emergencyPhone">
                    緊急聯絡電話
                </label>

                <input
                    type="tel"
                    id="emergencyPhone"
                    placeholder="+886 ..."
                >
            </div>

            <div class="form-group">
                <label data-i18n="criticalAllergy">
                    重要過敏
                </label>

                <input
                    type="text"
                    id="criticalAllergy"
                    placeholder="例如：藥物、食物"
                >
            </div>

            <div class="form-group">
                <label data-i18n="criticalCondition">
                    重要疾病
                </label>

                <input
                    type="text"
                    id="criticalCondition"
                    placeholder="例如：慢性疾病"
                >
            </div>

        </div>

    </section>


    <div class="grid">


        <!-- 基本資料 -->

        <section class="card">

            <div class="card-title">
                <div class="icon-box">👤</div>
                <h2 data-i18n="personalInfo">
                    個人基本資料
                </h2>
            </div>

            <div class="form-group">
                <label data-i18n="gender">性別</label>

                <input
                    type="text"
                    id="gender"
                    placeholder="請填寫"
                >
            </div>

            <div class="form-group">
                <label data-i18n="birthDate">出生日期</label>

                <input
                    type="date"
                    id="birthDate"
                >
            </div>

            <div class="form-group">
                <label data-i18n="nationality">國籍</label>

                <input
                    type="text"
                    id="nationality"
                    placeholder="例如：Taiwan"
                    oninput="updatePreview()"
                >
            </div>

            <div class="form-group">
                <label data-i18n="bloodType">血型</label>

                <select
                    id="bloodType"
                    class="form-select"
                    onchange="updatePreview()"
                >
                    <option value="">請選擇</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </div>

        </section>


        <!-- 過敏史 -->

        <section class="card">

            <div class="card-title">
                <div class="icon-box">⚠️</div>
                <h2 data-i18n="allergies">過敏史</h2>
            </div>

            <div class="form-group">
                <label data-i18n="allergyHistory">
                    請填寫所有已知過敏
                </label>

                <textarea
                    id="allergies"
                    placeholder="例如：
藥物：
食物：
環境：
過敏反應："
                ></textarea>
            </div>

        </section>


        <!-- 疾病史 -->

        <section class="card">

            <div class="card-title">
                <div class="icon-box">🏥</div>
                <h2 data-i18n="medicalHistory">疾病史</h2>
            </div>

            <div class="form-group">
                <label data-i18n="medicalHistoryDetail">
                    疾病名稱、診斷日期、目前狀態
                </label>

                <textarea
                    id="medicalHistory"
                    placeholder="例如：
疾病名稱：
診斷日期：
目前狀態：
治療方式："
                ></textarea>
            </div>

        </section>


        <!-- 家族病史 -->

        <section class="card">

            <div class="card-title">
                <div class="icon-box">👨‍👩‍👧‍👦</div>
                <h2 data-i18n="familyHistory">家族病史</h2>
            </div>

            <div class="form-group">
                <label data-i18n="familyHistoryDetail">
                    家庭成員與相關疾病
                </label>

                <textarea
                    id="familyHistory"
                    placeholder="例如：
父親：
母親：
兄弟姊妹：
祖父母："
                ></textarea>
            </div>

        </section>


        <!-- 手術史 -->

        <section class="card">

            <div class="card-title">
                <div class="icon-box">🩺</div>
                <h2 data-i18n="surgicalHistory">手術史</h2>
            </div>

            <div class="form-group">
                <label data-i18n="surgicalHistoryDetail">
                    手術名稱、日期、醫院
                </label>

                <textarea
                    id="surgicalHistory"
                    placeholder="例如：
手術名稱：
日期：
醫院：
備註："
                ></textarea>
            </div>

        </section>


        <!-- 住院史 -->

        <section class="card">

            <div class="card-title">
                <div class="icon-box">🛏️</div>
                <h2 data-i18n="hospitalHistory">住院史</h2>
            </div>

            <div class="form-group">
                <label data-i18n="hospitalHistoryDetail">
                    住院日期、原因與治療
                </label>

                <textarea
                    id="hospitalHistory"
                    placeholder="例如：
住院日期：
醫院：
原因：
治療："
                ></textarea>
            </div>

        </section>


        <!-- 用藥史 -->

        <section class="card">

            <div class="card-title">
                <div class="icon-box">💊</div>
                <h2 data-i18n="medicationHistory">用藥史</h2>
            </div>

            <div class="form-group">
                <label data-i18n="currentMedication">
                    目前使用藥物
                </label>

                <textarea
                    id="currentMedication"
                    placeholder="藥物名稱、劑量、使用方式"
                ></textarea>
            </div>

            <div class="form-group">
                <label data-i18n="pastMedication">
                    過去重要用藥
                </label>

                <textarea
                    id="pastMedication"
                    placeholder="過去使用的重要藥物"
                ></textarea>
            </div>

        </section>


        <!-- 疫苗紀錄 -->

        <section class="card">

            <div class="card-title">
                <div class="icon-box">💉</div>
                <h2 data-i18n="vaccination">疫苗紀錄</h2>
            </div>

            <div class="form-group">
                <label data-i18n="vaccinationDetail">
                    疫苗名稱與接種日期
                </label>

                <textarea
                    id="vaccination"
                    placeholder="例如：
疫苗名稱：
接種日期：
第幾劑："
                ></textarea>
            </div>

        </section>


        <!-- 健康資訊 -->

        <section class="card">

            <div class="card-title">
                <div class="icon-box">❤️</div>
                <h2 data-i18n="healthMetrics">
                    重要健康資訊
                </h2>
            </div>

            <div class="two-columns">

                <div class="form-group">
                    <label data-i18n="height">身高</label>

                    <input
                        type="text"
                        id="height"
                        placeholder="例如：170 cm"
                    >
                </div>

                <div class="form-group">
                    <label data-i18n="weight">體重</label>

                    <input
                        type="text"
                        id="weight"
                        placeholder="例如：60 kg"
                    >
                </div>

            </div>

            <div class="form-group">
                <label data-i18n="bloodPressure">血壓</label>

                <input
                    type="text"
                    id="bloodPressure"
                    placeholder="例如：120 / 80"
                >
            </div>

        </section>


        <!-- 其他 -->

        <section class="card">

            <div class="card-title">
                <div class="icon-box">📋</div>
                <h2 data-i18n="otherInfo">
                    其他重要醫療資訊
                </h2>
            </div>

            <div class="form-group">
                <label data-i18n="otherInfoDetail">
                    其他醫療注意事項
                </label>

                <textarea
                    id="otherInfo"
                    placeholder="可填寫其他重要醫療資訊"
                ></textarea>
            </div>

        </section>

    </div>

</main>


<footer>

    <p data-i18n="privacy">
        此頁面包含個人健康資訊，請妥善保護資料安全。
    </p>

    <p class="last-update">
        <span data-i18n="lastUpdated">最後儲存時間</span>：
        <span id="lastUpdated">尚未儲存</span>
    </p>

</footer>

    /* =========================
       所有要儲存的欄位
    ========================= */

    const fieldIds = [
        "fullName",
        "emergencyContact",
        "emergencyPhone",
        "criticalAllergy",
        "criticalCondition",
        "gender",
        "birthDate",
        "nationality",
        "bloodType",
        "allergies",
        "medicalHistory",
        "familyHistory",
        "surgicalHistory",
        "hospitalHistory",
        "currentMedication",
        "pastMedication",
        "vaccination",
        "height",
        "weight",
        "bloodPressure",
        "otherInfo"
    ];


    /* =========================
       儲存資料
    ========================= */

    function saveData() {

        const healthData = {};

        fieldIds.forEach(id => {
            healthData[id] =
                document.getElementById(id).value;
        });

        const now = new Date();

        healthData.lastUpdated =
            now.toLocaleString();

        localStorage.setItem(
            "mediPassHealthData",
            JSON.stringify(healthData)
        );

        document.getElementById("lastUpdated").textContent =
            healthData.lastUpdated;

        updatePreview();

        alert("✅ 資料已成功儲存在目前瀏覽器！");
    }


    /* =========================
       讀取資料
    ========================= */

    function loadData() {

        const savedData =
            localStorage.getItem("mediPassHealthData");

        if (!savedData) {
            updatePreview();
            return;
        }

        const healthData =
            JSON.parse(savedData);

        fieldIds.forEach(id => {

            if (
                healthData[id] !== undefined
            ) {
                document.getElementById(id).value =
                    healthData[id];
            }

        });

        if (healthData.lastUpdated) {

            document.getElementById("lastUpdated")
                .textContent =
                healthData.lastUpdated;
        }

        updatePreview();
    }


    /* =========================
       清除資料
    ========================= */

    function clearData() {

        const confirmed =
            confirm(
                "確定要清除目前瀏覽器中的所有健康資料嗎？"
            );

        if (!confirmed) return;

        localStorage.removeItem(
            "mediPassHealthData"
        );

        fieldIds.forEach(id => {
            document.getElementById(id).value = "";
        });

        document.getElementById("lastUpdated")
            .textContent = "尚未儲存";

        updatePreview();

        alert("資料已清除。");
    }


    /* =========================
       更新首頁預覽
    ========================= */

    function updatePreview() {

        const bloodType =
            document.getElementById("bloodType").value;

        const nationality =
            document.getElementById("nationality").value;

        document.getElementById("bloodPreview")
            .textContent =
            bloodType || "--";

        document.getElementById("nationalityPreview")
            .textContent =
            nationality || "--";
    }


    /* =========================
       切換語言
    ========================= */

    function changeLanguage() {

        const language =
            document.getElementById("languageSelect").value;

        document.documentElement.lang = language;

        document.querySelectorAll("[data-i18n]")
            .forEach(element => {

                const key =
                    element.getAttribute("data-i18n");

                if (
                    translations[language] &&
                    translations[language][key]
                ) {
                    element.textContent =
                        translations[language][key];
                }

            });

        document.querySelectorAll("[data-placeholder]")
            .forEach(element => {

                const key =
                    element.getAttribute(
                        "data-placeholder"
                    );

                if (
                    translations[language] &&
                    translations[language][key]
                ) {
                    element.placeholder =
                        translations[language][key];
                }

            });

        localStorage.setItem(
            "mediPassLanguage",
            language
        );
    }


    /* =========================
       網站開啟時
    ========================= */

    window.addEventListener(
        "DOMContentLoaded",
        () => {

            const savedLanguage =
                localStorage.getItem(
                    "mediPassLanguage"
                );

            if (savedLanguage) {

                document.getElementById(
                    "languageSelect"
                ).value = savedLanguage;
            }

            changeLanguage();
            loadData();

        }
    );

</script>
